<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Radioafición</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .card {
            background-color: #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            padding: 20px;
            text-align: center;
            flex: 1;
            min-width: 300px;
        }
        h2 {
            color: #00ffcc;
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .widget-container {
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 30px;">Estación de Radioaficionado - Monitoreo</h1>

    <div class="container">
        
        <!-- GRÁFICA 1: PROPAGACIÓN SOLAR (Widget Oficial Seguro HTTPS) -->
        <div class="card">
            <h2>Condiciones de Propagación</h2>
            <div class="widget-container">
                <a href="https://hamqsl.com" target="_blank" rel="noopener">
                    <img src="https://hamqsl.com" alt="Condiciones Solares" style="border:0; max-width:100%; height:auto;">
                </a>
            </div>
        </div>

        <!-- GRÁFICA 2: CONTENEDOR SEGURO PARA LOGBOOK / SKED (Reemplaza con tu enlace) -->
        <div class="card">
            <h2>Estadísticas de QSOs / Contactos</h2>
            <div class="widget-container">
                <!-- Se usa un iframe con ancho y alto forzados por CSS para evitar el error de 0 píxeles -->
                <!-- NOTA: Reemplaza la URL de abajo por la de tu Logbook (ej. de HRDLOG, ClubLog o QRZ) -->
                <iframe src="https://hamqsl.com" 
                        style="width:100%; min-height:250px; border:none; background:#2a2a2a;">
                </iframe>
            </div>
        </div>

    </div>

</body>
</html>
