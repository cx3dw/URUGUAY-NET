<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación de Control DX - Radioafición Profesional</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131a2c;
            --border-color: #1e293b;
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --text-main: #e2e8f0;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--neon-blue);
            padding-bottom: 15px;
            width: 100%;
            max-width: 1200px;
        }
        .header h1 {
            color: var(--neon-blue);
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--neon-green);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            position: relative;
        }
        .card::before {
            content: "• ONLINE";
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.7rem;
            color: var(--neon-green);
        }
        h2 {
            color: var(--neon-blue);
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }
        .widget-container {
            width: 100%;
            height: 400px;
            background-color: #05070c;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Estación de Monitoreo Global DX</h1>
        <div class="status-bar">
            <span>[SISTEMA: ACTIVO]</span>
            <span>[RED: EN LINEA]</span>
            <span>[MONITOR: TELEMETRÍA]</span>
        </div>
    </div>

    <div class="grid">
        
        <!-- PANEL 1: SEGUIMIENTO DE SATÉLITES DE RADIOAFICIÓN EN TIEMPO REAL -->
        <div class="card">
            <h2>Rastreo de Satélites Órbita Baja (LEO)</h2>
            <div class="widget-container">
                <!-- Mapa profesional interactivo en vivo de Satélites del servidor SatMap -->
                <iframe src="https://satellitemap.space" scrolling="no"></iframe>
            </div>
        </div>

        <!-- PANEL 2: MAPA EN VIVO DEL CLIMA ESPACIAL Y PROPAGACIÓN DE ONDA CORTA (HF) -->
        <div class="card">
            <h2>Rayos X Solares y Estado Ionosférico</h2>
            <div class="widget-container">
                <!-- Gráfica satelital del NOAA en tiempo real que mide flujos magnéticos y ráfagas solares -->
                <iframe src="https://noaa.gov"></iframe>
            </div>
        </div>

    </div>

</body>
</html>
