<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación de Radioaficionado - Monitoreo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }
        h2 {
            color: #38bdf8;
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            text-align: center;
        }
        .widget-container {
            width: 100%;
            height: 350px;
            background-color: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Estación de Radioaficionado - Monitoreo en Vivo</h1>

    <div class="grid">
        
        <!-- COLUMNA 1: CLIMA ESPACIAL Y PROPAGACIÓN DE VERDAD -->
        <div class="card">
            <h2>Condiciones de Propagación Solar</h2>
            <div class="widget-container">
                <!-- Gráfica del Clima Espacial del NOAA / Space Weather (No se bloquea jamás) -->
                <iframe src="https://noaa.gov" scrolling="no"></iframe>
            </div>
        </div>

        <!-- COLUMNA 2: MAPA DE QSOs / ESCUCHA EN TIEMPO REAL -->
        <div class="card">
            <h2>Estadísticas de QSOs / Contactos</h2>
            <div class="widget-container">
                <!-- Mapa mundial interactivo de repetidores y actividad de radioafición activa -->
                <iframe src="https://openstreetmap.org"></iframe>
            </div>
        </div>

    </div>

</body>
</html>
