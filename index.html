<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Radioaficionado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h2 {
            color: #06b6d4;
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .canvas-container {
            width: 100%;
            height: 250px;
            background-color: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Panel de Control CQ DX</h1>

    <div class="grid">
        
        <!-- GRÁFICA 1: MAPA MUNDIAL DE PROPAGACIÓN / RECEPTORES (Incrustación Segura Abierta) -->
        <div class="card">
            <h2>Mapa de Satélites y Cobertura</h2>
            <div class="canvas-container">
                <!-- Servidor geográfico abierto de OpenStreetMap, inmune a bloqueos de API -->
                <iframe src="https://openstreetmap.org"></iframe>
            </div>
        </div>

        <!-- GRÁFICA 2: INDICADOR DE PROPAGACIÓN HF NATIVO (Dibujado directamente por el navegador) -->
        <div class="card">
            <h2>Simulador de Bandas y Señal (S-Meter)</h2>
            <div class="canvas-container">
                <!-- SVG Nativo: Al ser código puro, el navegador se ve obligado a dibujarlo inmediatamente -->
                <svg viewBox="0 0 300 200" width="100%" height="100%">
                    <!-- Fondo del dial -->
                    <path d="M 30 170 A 130 130 0 0 1 270 170" fill="none" stroke="#334155" stroke-width="12" />
                    <!-- Zona de peligro / Señal Alta -->
                    <path d="M 210 70 A 130 130 0 0 1 270 170" fill="none" stroke="#ef4444" stroke-width="12" />
                    
                    <!-- Escala de Señal -->
                    <text x="35" y="185" fill="#94a3b8" font-size="12">S1</text>
                    <text x="70" y="110" fill="#94a3b8" font-size="12">S5</text>
                    <text x="145" y="35" fill="#94a3b8" font-size="12">S9</text>
                    <text x="245" y="110" fill="#ef4444" font-size="12">+20dB</text>
                    
                    <!-- Aguja (Simulando recepción en S9 activo) -->
                    <line x1="150" y1="170" x2="150" y2="45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
                    <circle cx="150" cy="170" r="8" fill="#38bdf8" />
                    
                    <!-- Texto de Estado -->
                    <text x="150" y="130" fill="#22c55e" font-size="16" font-weight="bold" text-anchor="middle">PROPAGACIÓN: ALTA</text>
                    <text x="150" y="155" fill="#a7f3d0" font-size="11" text-anchor="middle">Frecuencia de Prueba: 14.150 MHz</text>
                </svg>
            </div>
        </div>

    </div>

</body>
</html>
