<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola de Operaciones DX - Radioafición</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0f1626;
            --border: #1e293b;
            --cyan: #00f0ff;
            --amber: #f59e0b;
            --red: #ef4444;
            --green: #10b981;
            --text: #f1f5f9;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-main);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }
        .header {
            grid-column: 1 / -1;
            text-align: center;
            border-bottom: 2px solid var(--cyan);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header h1 { margin: 0; color: var(--cyan); font-size: 1.8rem; letter-spacing: 2px; }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 1.1rem;
            color: var(--cyan);
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 5px;
            text-transform: uppercase;
        }
        .widget-frame {
            width: 100%;
            height: 320px;
            border: none;
            background-color: #05070c;
            border-radius: 4px;
        }
        /* Estilos del Logger */
        .logger-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .logger-form label { font-size: 0.8rem; color: #94a3b8; }
        .logger-form input, .logger-form select {
            width: 100%;
            padding: 6px;
            background-color: #05070c;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: monospace;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .logger-form button {
            grid-column: 1 / -1;
            padding: 10px;
            background-color: var(--cyan);
            border: none;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .logger-form button:hover { background-color: #00c8d6; }
        .log-table-container {
            margin-top: 15px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.8rem;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: var(--cyan); border-bottom: 1px solid var(--border); padding: 5px; }
        td { padding: 5px; border-bottom: 1px solid #1e293b; }
    </style>
</head>
<body>

    <div class="header">
        <h1>CONSOLA DE MONITOREO & LOG DX</h1>
        <div style="color: var(--green); font-size: 0.8rem; margin-top: 5px;">[SISTEMA DE COMUNICACIONES GLOBAL OPERATIVO]</div>
    </div>

    <div class="dashboard">

        <!-- PANEL 1: LOGGER NATIVO PARA LLAMADOS GENERALES (CQ) -->
        <div class="card">
            <h2>Radio Logbook (Libro de Guardia)</h2>
            <div class="logger-form">
                <div>
                    <label>Indicativo / Callsign:</label>
                    <input type="text" id="callsign" placeholder="Ej. EA1ABC" style="text-transform: uppercase;">
                </div>
                <div>
                    <label>Banda / Frecuencia:</label>
                    <select id="band">
                        <option>40m (7 MHz)</option>
                        <option>20m (14 MHz)</option>
                        <option>15m (21 MHz)</option>
                        <option>10m (28 MHz)</option>
                        <option>2m (144 MHz)</option>
                    </select>
                </div>
                <div>
                    <label>Modo de Emisión:</label>
                    <select id="mode">
                        <option>SSB (Voz)</option>
                        <option>FT8 / Digital</option>
                        <option>CW (Morse)</option>
                        <option>FM</option>
                    </select>
                </div>
                <div>
                    <label>Reporte RST (Enviado):</label>
                    <input type="text" id="rst" value="59">
                </div>
                <button onclick="addLog()">Registrar Llamado General / QSO</button>
            </div>
            
            <div class="log-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha/UTC</th>
                            <th>Indicativo</th>
                            <th>Banda</th>
                            <th>Modo</th>
                            <th>RST</th>
                        </tr>
                    </thead>
                    <tbody id="log-body">
                        <!-- Los registros aparecerán aquí -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- PANEL 2: ALERTAS DE TERREMOTOS EN VIVO (Feed Global Sísmico) -->
        <div class="card">
            <h2 style="color: var(--red);">Alertas Globales de Terremotos</h2>
            <!-- Monitor interactivo del USGS que mapea los sismos mundiales en tiempo real sin bloquearse -->
            <iframe class="widget-frame" src="https://usgs.gov"></iframe>
        </div>

        <!-- PANEL 3: METEOROLOGÍA GLOBAL (Presión, Vientos y Satélite) -->
        <div class="card">
            <h2 style="color: var(--amber);">Servicio Meteorológico Global</h2>
            <!-- Widget profesional de visualización de capas de viento, tormentas y frentes de presión troposféricos -->
            <iframe class="widget-frame" src="https://usgs.gov" id="weather-placeholder" style="display:none;"></iframe>
            <iframe class="widget-frame" src="https://windy.com"></iframe>
        </div>

        <!-- PANEL 4: NOTICIAS INFORMATIVAS Y CONDICIONES HF -->
        <div class="card">
            <h2>Noticias y Boletines Informativos DX</h2>
            <!-- Incorporación segura de boletines informativos de radioafición y clima espacial internacional -->
            <iframe class="widget-frame" src="https://noaa.gov"></iframe>
        </div>

    </div>

    <script>
        function addLog() {
            const callsign = document.getElementById('callsign').value.toUpperCase();
            const band = document.getElementById('band').value;
            const mode = document.getElementById('mode').value;
            const rst = document.getElementById('rst').value;
            
            if (!callsign) {
                alert("Por favor introduce un indicativo válido.");
                return;
            }

            const now = new Date();
            const timeUTC = now.toISOString().replace('T', ' ').substring(0, 16) + "Z";

            const tableBody = document.getElementById('log-body');
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${timeUTC}</td>
                <td style="color: var(--cyan); font-weight: bold;">${callsign}</td>
                <td>${band}</td>
                <td>${mode}</td>
                <td>${rst}</td>
            `;

            tableBody.insertBefore(row, tableBody.firstChild);
            
            // Limpia el campo de texto para el próximo llamado
            document.getElementById('callsign').value = "";
        }
    </script>
</body>
</html>
